<style>
html,body{margin:0;padding:0;background:#F6F3F8}
*{box-sizing:border-box}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:#5B1A7A}
#shell{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#F6F3F8;display:flex;flex-direction:column;font-family:'Sarabun',sans-serif;color:#1C1324;font-size:16px;line-height:1.45}
.leaflet-container{font-family:'Sarabun',sans-serif}
.leaflet-div-icon{background:transparent;border:0}
.mono{font-family:'IBM Plex Mono',monospace}
.scroll{flex:1;overflow:auto}
.card{background:#fff;border:1px solid #E3DCE8;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.tile{background:#fff;border:1px solid #E3DCE8;border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.tile span{font-size:14px;color:#5E5566}
.fact{background:#F6F3F8;border-radius:10px;padding:8px 12px;min-width:0}

.fact div:last-child{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pill{padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.bp{height:48px;border:0;border-radius:12px;background:#5B1A7A;color:#fff;font-size:16px;font-weight:700}
.bo{height:48px;border:1.5px solid #5B1A7A;border-radius:12px;background:#fff;color:#5B1A7A;font-size:16px;font-weight:700}
.bnav{height:48px;border:1.5px solid #1565C0;border-radius:12px;background:#fff;color:#0D47A1;font-size:16px;font-weight:700}
.lbl{display:flex;flex-direction:column;gap:6px}
.lbl>span{font-size:15px;font-weight:600;color:#4A3F52}
.inp{height:52px;border:1.5px solid #C9BED1;border-radius:10px;padding:0 14px;font-size:17px;color:#1C1324;background:#fff;width:100%}
.ta{border:1.5px solid #C9BED1;border-radius:10px;padding:10px 12px;font-size:16px;resize:vertical;color:#1C1324}
.h15{font-size:15px;font-weight:800}
.sub{font-weight:500;color:#5E5566}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:repeating-linear-gradient(135deg,#E6DFEA 0 8px,#EFEAF2 8px 16px)}
.ph.g{background:repeating-linear-gradient(135deg,#DDEBDD 0 8px,#E9F2E9 8px 16px)}
.ph i{position:absolute;inset:0;background-size:cover;background-position:center}
.ph span{position:absolute;left:4px;bottom:4px;right:4px;font-size:11px;font-weight:600;background:rgba(255,255,255,.94);padding:1px 5px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cam{aspect-ratio:1;border-radius:10px;border:2px dashed #5B1A7A;background:#F7F0FA;color:#5B1A7A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:14px;font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.ico{flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
@media print{[data-noprint]{display:none !important}#shell,[data-main],[data-scroll]{height:auto !important;overflow:visible !important;box-shadow:none !important;border-radius:0 !important;position:static !important}body{background:#fff}}
/* รายงาน: A4 แนวตั้ง ตารางพอดีหน้า สีป้ายพิมพ์ออก แถว/ลายเซ็นไม่ขาดกลางหน้า */
@page{size:A4 portrait;margin:12mm}

  html,body,#shell{background:#fff !important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}

  .prow span span{white-space:normal !important;padding:1px 5px !important}

}

<script>
'use strict';
// ════════════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════════════
// Supabase — ใช้เฉพาะ publishable/anon key (ห้ามใส่ service_role) · เว้นว่าง = โหมดสาธิต (mock ใน memory)
const SUPABASE_URL = 'https://nwowvwadxdsidazolljk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2wpHTWLsPuswlj_mSnmfFQ_FZ89xplf';
const LIVE = !!(SUPABASE_URL && SUPABASE_KEY) && !/[?&]demo\b/.test(location.search);   // ?demo = บังคับโหมดสาธิต
// retry: false + timeout → สัญญาณหลอก (มีขีดแต่ใช้ไม่ได้) จะตกไปคิวออฟไลน์เร็ว แทนที่จะค้างรอ retry
const sb = LIVE ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db: { retry: false },
  global: { fetch: (u, o = {}) => fetch(u, { ...o, signal: o.signal || AbortSignal.timeout(20000) }) } }) : null;
const emailOf = (office, username) => username.trim().toLowerCase() + '@' + office + '.local';
const P = '#5B1A7A';
const WIDE_PX = 900;            // ≥ นี้ = เดสก์ท็อป (แผนที่ซ้าย รายการขวา)
const FAR_M = 50;               // หมุดห่างแนวสายเกินนี้ = เตือน
// รหัสยืนยันการลบงาน — กันกดลบโดยไม่ตั้งใจเท่านั้น (สิทธิ์ลบจริงคุมด้วย RLS: เฉพาะผู้ตรวจในการไฟฟ้าตน)
const DELETE_PIN = '509758';
const M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TYPES = ['ระยะห่างไม่ถึงเกณฑ์','กิ่งค้างบนสาย','ไม่เก็บกิ่ง','ตัดไม่ครบ','อื่นๆ'];
// สถานะจุดบกพร่อง (ค่าตาม DB schema)
const DEF = {
  open:     { label:'รอแก้ไข',         solid:'#C62828', bg:'#FDE7E7', fg:'#8E1B1B', glyph:'!', shape:'50%' },
  submitted:{ label:'รอตรวจ',          solid:'#E87500', bg:'#FFEFD6', fg:'#7A3B00', glyph:'⧗', shape:'6px' },
  passed:   { label:'ผ่าน',            solid:'#2E7D32', bg:'#E3F2E4', fg:'#1B5E20', glyph:'✓', shape:'50%' },
  rejected: { label:'ไม่ผ่าน ส่งกลับ',  solid:'#7F1D1D', bg:'#F6D5D5', fg:'#6B1414', glyph:'✕', shape:'2px' }
};
// ช่วงงานตัด: cutting/cut = งานของผู้รับจ้างก่อนตรวจรับ (สีเขียวอมฟ้า) · ตรวจแล้ว (defect/pass) แสดงผลตรวจแทน
const SEG = {
  none:  { label:'ยังไม่เริ่มตัด',     solid:'#6B6472', bg:'#EEEAF0', fg:'#3F3846', glyph:'–' },
  cutting:{ label:'กำลังตัด',          solid:'#00838F', bg:'#DDF3F4', fg:'#00585F', glyph:'⚒' },
  cut:   { label:'ตัดเสร็จ รอตรวจ',    solid:'#00636B', bg:'#C9EAEC', fg:'#00454B', glyph:'✂' },
  defect:{ label:'มีจุดบกพร่องค้าง',  solid:'#C62828', bg:'#FDE7E7', fg:'#8E1B1B', glyph:'!' },
  pass:  { label:'ผ่าน',             solid:'#2E7D32', bg:'#E3F2E4', fg:'#1B5E20', glyph:'✓' }
};
const FEED = {
  active: { label:'กำลังตรวจ',          bg:'#F1E7F6', fg:'#4A1564', glyph:'●' },
  waiting:{ label:'รอผู้รับจ้างแก้ไข',   bg:'#FFEFD6', fg:'#7A3B00', glyph:'⧗' },
  closed: { label:'ปิดงานแล้ว',         bg:'#E3F2E4', fg:'#1B5E20', glyph:'✓' }
};
// defect_events.kind → [สี, glyph, shape, หัวข้อ timeline(round), หัวข้อสั้น]
const EV = {
  created:      ['#C62828','!','50%', r => 'ตรวจครั้งที่ ' + r + ' · พบจุดบกพร่อง', 'พบจุดบกพร่อง'],
  fix_submitted:['#E87500','⧗','6px', () => 'ผู้รับจ้างส่งหลักฐานการแก้ไข', 'ผู้รับจ้างส่งหลักฐานแก้ไข'],
  passed:       ['#2E7D32','✓','50%', r => 'ตรวจครั้งที่ ' + r + ' · ผ่าน', 'ตรวจผ่าน'],
  rejected:     ['#7F1D1D','✕','2px', r => 'ตรวจครั้งที่ ' + r + ' · ไม่ผ่าน ส่งกลับแก้ใหม่', 'ไม่ผ่าน ส่งกลับ']
};
// งานตัดของผู้รับจ้าง: [หัวข้อ, รูปขั้นต่ำ, รูปสูงสุด, คำแนะนำการถ่าย]
const WORK = {
  started: ['เริ่มตัด · รูปก่อนตัด', 1, 10, 'ถ่ายสภาพต้นไม้ก่อนตัด ในแนวสายของช่วงนี้'],
  finished:['ตัดเสร็จ · รูปหลังตัด', 4, 10, 'อย่างน้อย 4 รูป: ต้นช่วง · กลางช่วง · ปลายช่วง · การเก็บกิ่ง']
};
const WORK_FAR_M = 200;          // รูปถ่ายห่างแนวช่วงเกินนี้ = เตือนผู้ตรวจ
const WORK_OLD_H = 72;           // เวลาถ่าย (EXIF) ก่อนส่งรายงานเกินนี้ (ชม.) = เตือน "รูปเก่า"
const oldPhoto = (ph, at) => ph.taken && (+new Date(at) - +new Date(ph.taken)) / 36e5 > WORK_OLD_H;
const TILES = {
  osm: ['https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', '© OpenStreetMap'],
  sat: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', 'Esri']
};
const TOAST_BG = { ok:'#1B5E20', off:'#2B2230', rt:'#B85C00', err:'#B3261E' };

// ════════════════════════════════════════════════════════════════
// DATA LAYER — 2 โหมด: LIVE = Supabase, ไม่ LIVE = mock ใน memory (สาธิต/พัฒนา)
//   ทุก action เรียก db.* แล้ว (LIVE) โหลดข้อมูลใหม่ทั้งชุด — ponytail: ข้อมูล กฟส. หนึ่งไม่กี่พันแถว, เปลี่ยนเป็นโหลดเฉพาะส่วนถ้าช้า
// ════════════════════════════════════════════════════════════════
const MOCK_OFFICES = [ { id:'kce', name:'กฟส.คำชะอี' }, { id:'ktw', name:'กฟส.กันทรวิชัย' } ];
const MOCK_USERS = [
  { id:'somchai.j', username:'somchai.j', office:'kce', role:'inspector',  full_name:'สมชาย ใจดี', is_admin:true },
  { id:'romyen.co', username:'romyen.co', office:'kce', role:'contractor', full_name:'ผู้ประสานงาน ร่มเย็น', company:'หจก. ร่มเย็นการโยธา' },
  { id:'thaipruek', username:'thaipruek', office:'kce', role:'contractor', full_name:'ผู้ประสานงาน ไทยพฤกษ์', company:'บริษัท ไทยพฤกษ์ เซอร์วิส จำกัด' },
  { id:'wichai.k',  username:'wichai.k',  office:'ktw', role:'inspector',  full_name:'วิชัย กล้าหาญ' },
  { id:'srisuk.co', username:'srisuk.co', office:'ktw', role:'contractor', full_name:'ผู้ประสานงาน ศรีสุข', company:'หจก. ศรีสุขการไฟฟ้า' }
];
const officeName = id => (S.offices.find(o => o.id === id) || {}).name || '';
const contractorsOf = office => S.profiles.filter(u => u.office === office && u.role === 'contractor');
const whoOf = id => { const u = S.profiles.find(p => p.id === id); return !u ? '' : u.role === 'inspector' ? u.full_name + ' (ผู้ตรวจ)' : u.company || u.full_name; };
const pad4 = n => 'D-' + String(n).padStart(4, '0');
const uuid = () => crypto.randomUUID();
const fail = (e, ctx) => { console.error(ctx, e); throw new Error((e && e.message) || String(e)); };
const q = async (p, ctx) => { const { data, error } = await p; if (error) fail(error, ctx); return data; };

const db = {
  // ── เริ่มต้น: รายชื่อการไฟฟ้า + กู้ session เดิม ──
  // ไม่มีเน็ต → ใช้สำเนาล่าสุดใน IndexedDB (session ของ supabase อยู่ในเครื่องอยู่แล้ว)
  async init() {
    if (!LIVE) return null;
    const sp = await snap.get(), { data } = await sb.auth.getSession(), uid = data.session && data.session.user.id;
    try { S.offices = await q(sb.from('offices').select('*').order('name'), 'offices'); }
    catch (e) { if (!isNetErr(e) || !sp) throw e; S.offices = sp.offices; }
    if (!uid) return null;
    try { return await db.profile(uid); } catch (e) { if (isNetErr(e) && sp && sp.user === uid) return sp.me; throw e; }
  },
  async profile(id) {
    const p = await q(sb.from('profiles').select('*').eq('id', id).maybeSingle(), 'profile');
    return p && { ...p, office: p.office_id };
  },
  async signIn(office, username, password) {
    if (!LIVE) { const u = MOCK_USERS.find(x => x.office === office && x.username === username.trim()); if (u && u.active === false) throw new Error('บัญชีนี้ถูกปิดการใช้งาน — ติดต่อผู้ดูแลระบบ'); return u || null; }
    const { data, error } = await sb.auth.signInWithPassword({ email: emailOf(office, username), password });
    if (error) { if (/banned/i.test(error.message)) throw new Error('บัญชีนี้ถูกปิดการใช้งาน — ติดต่อผู้ดูแลระบบ'); return null; }
    const p = await db.profile(data.user.id);
    if (!p) { await sb.auth.signOut(); throw new Error('บัญชีนี้ยังไม่ได้ผูกโปรไฟล์ — ติดต่อผู้ดูแลระบบ'); }
    return p;
  },
  signOut: () => LIVE ? sb.auth.signOut() : null,
  // ── โหลดทุกอย่างที่ผู้ใช้เห็นได้ (RLS กรองให้แล้ว) ──
  async load() {
    if (!LIVE) return;
    // ออฟไลน์ → ใช้สำเนาล่าสุดทันที (ไม่ยิง fetch ให้ supabase-js retry ค้างหลายวินาที)
    let ok = false;
    if (S.online) { try { await db.fetchAll(); snap.save(); ok = true; } catch (e) { if (!isNetErr(e)) throw e; } }
    if (!ok) { const sp = await snap.get(); if (sp && sp.user === S.me.id) Object.assign(S, { profiles: sp.profiles, feeders: sp.feeders, defects: sp.defects }); }
    // รายการที่ยังรอส่ง → ทับบนข้อมูลล่าสุดให้เห็นบนจอ
    const ops = await queue.mine().catch(() => []);
    ops.forEach(op => local[op.type](op.p, true));
    S.queue = ops.length;
  },
  async fetchAll() {
    const [pr, fe, fc, sg, df, ev, wk] = await Promise.all([
      q(sb.from('profiles').select('id,office_id,username,full_name,role,company'), 'profiles'),
      q(sb.from('feeders').select('*').order('code'), 'feeders'),
      q(sb.from('feeder_contractors').select('*'), 'feeder_contractors'),
      q(sb.from('segments').select('*').order('seq'), 'segments'),
      q(sb.from('defects').select('*').order('code_no'), 'defects'),
      q(sb.from('defect_events').select('*').order('created_at'), 'defect_events'),
      q(sb.from('segment_works').select('*').order('created_at'), 'segment_works')]);
    S.profiles = pr.map(p => ({ ...p, office: p.office_id }));
    const paths = [...ev, ...wk].flatMap(e => (e.photos || []).map(p => p.path)).filter(Boolean);
    const urls = {};
    if (paths.length) (await q(sb.storage.from('photos').createSignedUrls(paths, 12 * 3600), 'signedUrls')).forEach(u => { if (u.signedUrl) urls[u.path] = u.signedUrl; });
    const segById = {}, viewPh = ps => (ps || []).map(p => ({ ...p, url: urls[p.path] || null }));
    const worksOf = sid => wk.filter(w => w.segment_id === sid).map(w => ({ id: w.id, kind: w.kind, at: w.created_at, edited: w.updated_at, note: w.note || '', photos: viewPh(w.photos), who: whoOf(w.actor_id), pending: false }));
    S.feeders = fe.map(f => {
      const cid = (fc.find(x => x.feeder_id === f.id) || {}).contractor_id, con = S.profiles.find(p => p.id === cid);
      const segments = sg.filter(s => s.feeder_id === f.id).map(s => (segById[s.id] = { ...s, length_km: +s.length_km, coords: s.geom_geojson.coordinates.map(c => [c[1], c[0]]), pending: false, works: worksOf(s.id) }));
      return { id: f.id, code: f.code, line: f.line_name, office: f.office_id, contractor_id: cid || null, contractor: con ? con.company || con.full_name : '–', closed_at: f.closed_at, imported_at: f.created_at, segments };
    });
    S.defects = df.map(d => ({ id: d.id, code: pad4(d.code_no), feeder_id: d.feeder_id, segment_id: d.segment_id, seq: (segById[d.segment_id] || {}).seq, lat: d.lat, lng: d.lng,
      issue_type: d.issue_type, status: d.status, round_no: d.round_no,
      events: ev.filter(e => e.defect_id === d.id).map(e => ({ id: e.id, kind: e.kind, round_no: e.round_no, at: e.created_at, note: e.note || '', pending: false, who: whoOf(e.actor_id), actor_id: e.actor_id,
        photos: (e.photos || []).map(p => ({ label: p.label, path: p.path, url: urls[p.path] || null })) })) }));
  },

// ── ย่อรูปในเครื่อง: ด้านยาว ≤ 1600px, JPEG ลดคุณภาพจน ≤ ~300 KB ──
async function shrink(file) {

    const img = await createImageBitmap(file, { imageOrientation: 'from-image' }), k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);

    do { b = await new Promise(r => c.toBlob(r, 'image/jpeg', q)); q -= 0.1; } while (b.size > 300 * 1024 && q > 0.45);
    return new File([b], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch (e) { return file; }   // ponytail: ถอดรหัสรูปไม่ได้ (เช่น HEIC บนเดสก์ท็อป) → ส่งไฟล์ต้นฉบับ
}
// ── EXIF (JPEG) → { lat, lng, taken } จากไฟล์ต้นฉบับ (ต้องอ่านก่อนย่อ — canvas ทิ้ง EXIF) · อ่านไม่ได้/ไม่มี = {} ──
async function readExif(file) {
  try {
    const b = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
    if (b.getUint16(0) !== 0xFFD8) return {};
    for (let o = 2; o < b.byteLength - 10; o += 2 + b.getUint16(o + 2)) {
      const m = b.getUint16(o); if ((m & 0xFF00) !== 0xFF00 || m === 0xFFDA) break;
      if (m !== 0xFFE1 || b.getUint32(o + 4) !== 0x45786966) continue;   // APP1 "Exif"
      const t = o + 10, le = b.getUint16(t) === 0x4949, u16 = p => b.getUint16(p, le), u32 = p => b.getUint32(p, le);
      const ifd = p => { const r = {}; for (let i = 0, n = u16(p); i < n; i++) r[u16(p + 2 + i * 12)] = p + 2 + i * 12; return r; };
      const str = e => { const n = u32(e + 4), p = n > 4 ? t + u32(e + 8) : e + 8; let s = ''; for (let i = 0; i < n - 1; i++) s += String.fromCharCode(b.getUint8(p + i)); return s; };
      const rat = p => u32(p) / u32(p + 4), dms = e => { const p = t + u32(e + 8); return rat(p) + rat(p + 8) / 60 + rat(p + 16) / 3600; };

      const dt = ex[0x9003] ? str(ex[0x9003]) : i0[0x0132] ? str(i0[0x0132]) : '', d = dt.match(/^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);
      if (d) out.taken = new Date(+d[1], d[2] - 1, +d[3], +d[4], +d[5], +d[6]).toISOString();   // EXIF ไม่มีโซนเวลา = เวลาเครื่องที่ถ่าย
      if (gp[2] && gp[4]) { const lat = dms(gp[2]) * (str(gp[1]) === 'S' ? -1 : 1), lng = dms(gp[4]) * (str(gp[3]) === 'W' ? -1 : 1);

      return out;
    }
  } catch (e) {}

}

  if (!code) return set({ imp: { ...im, err: 'กรุณากรอกรหัส Feeder' } });
  if (LIVE && !S.online) return set({ imp: { ...im, err: 'ไม่มีสัญญาณ — การนำเข้า Feeder ต้องออนไลน์' } });
  const segs = ex && im.mode === 'append' ? used : im.segs;
  run(async () => {
    const fid = await db.importFeeder(ex, code, line, im.contractor, im.mode, segs);
    S.imp = { step: 'pick' };
    return ['นำเข้า ' + code + ' แล้ว · ' + segs.length + ' ช่วงงานตัด', 'ok', () => openFeeder(fid)];
  });
}

function toggleOnline() {
  if (S.online) return set({ online: false });
  const n = S.queue; if (!n) return set({ online: true });
  set({ online: true, syncing: true });
  setTimeout(() => {
    S.syncing = false; S.queue = 0;
    S.feeders = S.feeders.map(f => ({ ...f, segments: f.segments.map(x => x.pending ? { ...x, pending: false } : x) }));
    S.defects = S.defects.map(d => ({ ...d, events: d.events.map(h => h.pending ? { ...h, pending: false } : h) }));
    showToast('ส่งข้อมูลที่ค้างในเครื่องครบแล้ว ' + n + ' รายการ', 'ok');
  }, 1800);
}

function syncMain() {

  if (!map) {
    map = L.map(mapEl, { zoomControl: false }); L.control.zoom({ position: 'bottomright' }).addTo(map);
    layer = L.layerGroup().addTo(map);
    map.on('click', e => { if (S.draft) moveDraft(e.latlng.lat, e.latlng.lng); else if (S.panel.mode === 'segment' && !S.wide) set({ panel: { mode: 'list' } }); });

  const selSeg = S.panel.mode === 'segment' ? S.panel.seq : null, selDef = S.panel.mode === 'defect' ? S.panel.id : null, ds = dOf(f.id), dr = S.draft;
  const sg = JSON.stringify([f.id, f.segments.length, f.segments.map(x => segSt(f, x)), ds.map(d => [d.id, d.status, d.lat, d.lng]), selSeg, selDef, dr && [dr.lat, dr.lng, dr.seq], S.user]);
  if (sg !== sig) {

      L.polyline(s.coords, { color: sel ? P : '#fff', weight: sel ? 15 : 11, opacity: .95, interactive: false }).addTo(layer);
      L.polyline(s.coords, { color: c, weight: 6, dashArray: st === 'none' ? '8 9' : st === 'cutting' ? '14 7' : null, interactive: false }).addTo(layer);
      L.polyline(s.coords, { color: '#000', weight: 26, opacity: 0 }).on('click', e => { L.DomEvent.stopPropagation(e); if (S.draft) return moveDraft(e.latlng.lat, e.latlng.lng); selectSeg(s.seq); }).addTo(layer);

    });
    if (S.user) L.circle([S.user.lat, S.user.lng], { radius: Math.max(18, Math.min(S.user.acc || 18, 200)), color: '#1565C0', weight: 1, fillOpacity: .12, interactive: false }).addTo(layer);
    if (S.user) L.circleMarker([S.user.lat, S.user.lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#1565C0', fillOpacity: 1, interactive: false }).addTo(layer);

function syncMini() {
  if (S.screen !== 'import' || S.imp.step !== 'preview' || !miniEl.isConnected) return;
  if (!mini) { mini = L.map(miniEl, { zoomControl: false, attributionControl: false }); L.tileLayer(TILES.osm[0], { maxZoom: 19 }).addTo(mini); miniLayer = L.layerGroup().addTo(mini); }

  }
  requestAnimationFrame(() => {
    mini.invalidateSize();
    const all = [...segs, ...(ex && im.mode === 'append' ? ex.segments : [])].flatMap(s => s.coords);
    if (all.length) mini.fitBounds(L.latLngBounds(all), { padding: [24, 24] });
  });
}

  let deg = 0; const ring = RING.map(k => { const a = deg; deg += cnt(k) / n * 360; return SEG_BAR(k) + ' ' + a.toFixed(1) + 'deg ' + deg.toFixed(1) + 'deg'; }).join(',');
  const kmPass = f.segments.reduce((a, x, i) => a + (st.st[i] === 'pass' ? x.length_km : 0), 0), by = k => st.ds.filter(d => d.status === k).length;
  const acts = [];

function impCalc() {
  const im = S.imp, code = im.code.trim().toUpperCase(), ex = byCode(code), have = new Set(ex ? ex.segments.map(x => x.seq) : []);
  const dup = n => !!ex && im.mode === 'append' && have.has(n);
  return { code, ex, dup, used: im.segs.filter(x => !dup(x.seq)) };
}

function vReport() {

    <div data-rwrap style="max-width:1000px;margin:12px auto 32px;padding:0 16px"><div data-rcard style="background:#fff;border:1px solid #E3DCE8;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:22px">
      <div style="display:flex;gap:14px;align-items:center;border-bottom:3px solid ${P};padding-bottom:16px;flex-wrap:wrap">
        <div style="flex:none;width:52px;height:52px;border-radius:12px;background:${P};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800">กฟภ.</div>
        <div style="flex:1;min-width:220px"><div style="font-size:15px;color:#5E5566">รายงานสรุปผลการตรวจรับงานตัดต้นไม้ · การไฟฟ้าส่วนภูมิภาค ${esc(officeName(f.office))}</div><div style="font-size:24px;font-weight:800;line-height:1.3"><span class="mono" style="color:${P}">${esc(f.code)}</span> ${esc(f.line)}</div></div>

        </div></div></div>
      <div class="psign" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;margin-top:12px">${sign('ผู้ตรวจรับ')}${sign('ผู้รับจ้าง')}</div>
    </div></div></div>`;
}

  if (!S.sheet || (S.sheet === 'defect' ? !S.draft : !S.form)) return '';
  const f = curF(), wide = S.wide, offline = !S.online;

  const photos = (list, cls, fileAct, demoAct, hint) => `<div class="grid3">${list.map(ph => photo(ph, cls)).join('')}${camInput(fileAct)}</div>
    <div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#5E5566"><span>${hint}</span>${LIVE ? '' : `<button data-act="${demoAct}" class="link">+ รูปตัวอย่าง</button>`}</div>`;

  startReject: () => set({ sheet: 'reject', err: null, form: { id: S.panel.id, note: '', photos: [] } }),
  passDefect,
  print() { const t = document.title, f = curF(); document.title = 'รายงาน ' + f.code + (f.line ? ' ' + f.line : ''); window.print(); document.title = t; },
  closeFeeder,
  delStart() {
    if (LIVE && !S.online) return showToast('ไม่มีสัญญาณ — การลบงานต้องออนไลน์', 'off');
    if (S.queue) return showToast('ยังมีข้อมูลรอส่ง ' + S.queue + ' รายการ — ส่งให้ครบก่อนลบงาน', 'err', 6000);
    set({ del: { step: 1, pin: '', err: null } });
  },
  delCancel: () => set({ del: null }), delNext: () => set({ del: { step: 2, pin: '', err: null } }), delBack: () => set({ del: { step: 1, pin: '', err: null } }),
  delConfirm() {
    if (S.del.pin !== DELETE_PIN) return set({ del: { ...S.del, pin: '', err: 'รหัสไม่ถูกต้อง' } });
    const f = curF();
    run(async () => { await db.deleteFeeder(f); S.del = null; return ['ลบงาน ' + f.code + ' แล้ว', 'ok', () => set({ screen: 'dash', cur: null })]; });
  },
  // ── จัดการระบบ ──
  admLoginOpen: () => set({ admLogin: { user: '', pw: '', err: null } }),
  admLoginCancel: () => set({ admLogin: null }),
  // ยืนยันด้วยบัญชีผู้ดูแลระบบ (is_admin) → เข้าหน้าจัดการ ไม่โหลดงาน/GPS/realtime
  async admLoginGo() {
    const a = S.admLogin;
    if (!a.user.trim() || !a.pw) return set({ admLogin: { ...a, err: 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน' } });
    if (LIVE && !S.online) return set({ admLogin: { ...a, err: 'ไม่มีสัญญาณ — การจัดการระบบต้องออนไลน์' } });
    set({ busy: true });
    let u; try { u = await db.signIn(S.office, a.user, a.pw); } catch (e) { return set({ busy: false, admLogin: { ...a, err: e.message } }); }
    if (!u) return set({ busy: false, admLogin: { ...a, pw: '', err: 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง' } });
    if (!u.is_admin) { await db.signOut(); return set({ busy: false, admLogin: { ...a, pw: '', err: 'บัญชีนี้ไม่ใช่ผู้ดูแลระบบ' } }); }
    Object.assign(S, { me: u, busy: false, admLogin: null });
    ACT.goAdmin();
  },
  goAdmin() {
    set({ screen: 'admin', adm: { users: [], loading: true, filter: S.me.office, office: { id: '', name: '' }, newRole: null, form: null, modal: null } });
    admLoad();
  },
  admNew: role => set({ adm: { ...S.adm, newRole: role || null, form: role ? { office_id: S.adm.filter || S.me.office, role, username: '', full_name: '', company: '', password: '' } : null } }),
  admAddOffice() {
    const id = S.adm.office.id.trim().toLowerCase(), name = S.adm.office.name.trim();
    if (!/^[a-z0-9]{2,10}$/.test(id)) return showToast('รหัสการไฟฟ้า: a-z 0-9 ยาว 2–10 ตัว ไม่มีช่องว่าง', 'err', 5000);
    if (!name) return showToast('กรุณากรอกชื่อการไฟฟ้า', 'err');
    admRun(async () => { await admApi.addOffice(id, name); S.adm.office = { id: '', name: '' }; return 'เพิ่ม ' + name + ' แล้ว'; });
  },
  admCreate() {
    const f = { ...S.adm.form, username: S.adm.form.username.trim().toLowerCase(), full_name: S.adm.form.full_name.trim(), company: S.adm.form.company.trim() };
    if (!/^[a-z0-9._-]{3,32}$/.test(f.username)) return showToast('ชื่อผู้ใช้ใช้ได้เฉพาะ a-z 0-9 . _ - ยาว 3–32 ตัว', 'err', 5000);
    if (f.role === 'contractor' && !f.company) return showToast('กรุณากรอกชื่อบริษัท/หจก.', 'err');
    if (f.password.length < 6) return showToast('รหัสผ่านอย่างน้อย 6 ตัว', 'err');
    admRun(async () => { await admApi.create(f); Object.assign(S.adm, { newRole: null, form: null, filter: f.office_id });   // แสดงรายชื่อของการไฟฟ้าที่เพิ่ง
      return 'เพิ่ม' + ROLE_TH[f.role] + ' ' + f.username + ' แล้ว · เข้าสู่ระบบโดยเลือก ' + officeName(f.office_id); });
  },
  admPw: id => { const u = S.adm.users.find(x => x.id === id); set({ adm: { ...S.adm, modal: { id, username: u.username, pw: '' } } }); },
  admPwCancel: () => set({ adm: { ...S.adm, modal: null } }),
  admPwSave() {
    const m = S.adm.modal; if (m.pw.length < 6) return showToast('รหัสผ่านอย่างน้อย 6 ตัว', 'err');
    admRun(async () => { await admApi.setPassword(m.id, m.pw); S.adm.modal = null; return 'ตั้งรหัสผ่านใหม่ของ ' + m.username + ' แล้ว'; });
  },
  admToggle(id) {
    const u = S.adm.users.find(x => x.id === id);
    admRun(async () => { await admApi.setActive(id, !u.active); return (u.active ? 'ปิดบัญชี ' : 'เปิดบัญชี ') + u.username + ' แล้ว'; });
  },
  admDel: id => set({ adm: { ...S.adm, confirm: { step: 1, id, pin: '', err: null } } }),
  admDelOffice: office => set({ adm: { ...S.adm, confirm: { step: 1, office, pin: '', err: null } } }),
  admDelCancel: () => set({ adm: { ...S.adm, confirm: null } }),
  admDelNext: () => set({ adm: { ...S.adm, confirm: { ...S.adm.confirm, step: 2, pin: '', err: null } } }),
  admDelBack: () => set({ adm: { ...S.adm, confirm: { ...S.adm.confirm, step: 1, pin: '', err: null } } }),
  admDelConfirm() {
    const cf = S.adm.confirm, id = cf.id, u = S.adm.users.find(x => x.id === id);
    if (cf.pin !== DELETE_PIN) return set({ adm: { ...S.adm, confirm: { ...cf, pin: '', err: 'รหัสไม่ถูกต้อง' } } });
    S.adm.confirm = null;
    if (cf.office) { const name = officeName(cf.office); return admRun(async () => { await admApi.removeOffice(cf.office); if (S.adm.filter === cf.office) S.adm.filter = ''; return 'ลบ ' + name + ' แล้ว'; }); }
    admRun(async () => { const r = await admApi.remove(id); return r.deleted ? 'ลบ ' + u.username + ' แล้ว' : u.username + ' มีประวัติในระบบ — ปิดบัญชีแทนการลบ'; });
  },
  closeSheet, saveSheet: () => ({ defect: saveDefect, fix: saveFix, reject: saveReject, work: saveWork })[S.sheet](),
  editWork(a) {
    if (LIVE && !S.online) return showToast('ไม่มีสัญญาณ — การแก้ไขรายงานต้องออนไลน์', 'off');
    const [seq, kind] = a.split(':'), w = workOf(curF().segments.find(x => x.seq === +seq), kind);
    set({ sheet: 'work', err: null, form: { seq: +seq, kind, note: w.note, photos: [...w.photos], editId: w.id } });
  },
  delWork(a) {
    if (LIVE && !S.online) return showToast('ไม่มีสัญญาณ — การลบรายงานต้องออนไลน์', 'off');
    const [seq, kind] = a.split(':'); set({ wconf: { mode: 'del', seq: +seq, kind, step: 1 } });
  },
  workRmPhoto: i => set({ form: { ...S.form, photos: S.form.photos.filter((_, j) => j !== +i) } }),
  wconfCancel: () => set({ wconf: null }), wconfNext: () => set({ wconf: { ...S.wconf, step: 2 } }), wconfBack: () => set({ wconf: { ...S.wconf, step: 1 } }), wconfGo,
  startWork: a => { const [seq, kind] = a.split(':'); set({ sheet: 'work', err: null, form: { seq: +seq, kind, note: '', photos: [] } }); },
  demoWorkPhoto: () => { const x = curF().segments.find(y => y.seq === S.form.seq), m = along(x.coords, .5); set({ form: { ...S.form, photos: [...S.form.photos, { ...demoPhoto(), lat: m[0], lng: m[1] }].slice(0, WORK[S.form.kind][2]) }, err: null }); },
  draftSeg: seq => set({ draft: { ...S.draft, seq: +seq, manual: true } }),
  draftType: i => set({ draft: { ...S.draft, type: TYPES[+i] }, err: null }),
  draftRound: r => set({ draft: { ...S.draft, round: +r } }),
  regps() { if (!S.user) return showToast(S.gpsErr || 'ยังไม่มีสัญญาณ GPS', 'off'); centerTo = [S.user.lat, S.user.lng]; moveDraft(S.user.lat, S.user.lng, 'gps'); },
  demoDraftPhoto: () => set({ draft: { ...S.draft, photos: [...S.draft.photos, demoPhoto()] } }),
  demoSheetPhoto: () => set({ form: { ...S.form, photos: [...S.form.photos, demoPhoto()] }, err: null }),
  openNotif(id) { const n = S.notifs.find(x => String(x.id) === id); if (!n) return; openFeeder(n.feederId); openDefect(n.defectId); }
};
const FILE = {
  impPick: impPickFiles,
  draftPhotos: async e => { const fs = Array.from(e.target.files || []); e.target.value = ''; const p = await readPhotos(fs); set({ draft: { ...S.draft, photos: [...S.draft.photos, ...p] } }); },
  sheetPhotos: async e => { const fs = Array.from(e.target.files || []); e.target.value = ''; const p = await readPhotos(fs); set({ form: { ...S.form, photos: [...S.form.photos, ...p] }, err: null }); },
  // พิกัด: EXIF ของรูป (src exif) ก่อน · ไม่มี → GPS เครื่องตอนเลือกรูป (src gps) · taken = เวลาถ่ายจาก EXIF
  workPhotos: async e => {
    const fs = Array.from(e.target.files || []), u = S.user, max = WORK[S.form.kind][2]; e.target.value = '';
    const [exs, ps] = await Promise.all([Promise.all(fs.map(readExif)), readPhotos(fs)]);
    const p = ps.map((ph, i) => { const x = exs[i]; return { ...ph, taken: x.taken || null, ...(x.lat != null ? { lat: x.lat, lng: x.lng, src: 'exif' } : u ? { lat: u.lat, lng: u.lng, src: 'gps' } : {}) }; });
    const all = [...S.form.photos, ...p];
    if (all.length > max) showToast('แนบได้สูงสุด ' + max + ' รูป — ใช้ ' + max + ' รูปแรก', 'err', 5000);
    set({ form: { ...S.form, photos: all.slice(0, max) }, err: null });
  }
};
shell.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; ACT[el.dataset.act](el.dataset.arg); });
// พิมพ์ = เก็บค่าเงียบๆ (ไม่ render → focus ไม่หลุด); data-rr = render ตอน change
const setPath = (path, v) => { const k = path.split('.'), last = k.pop(); let o = S; for (const p of k) o = o[p]; o[last] = v; };
shell.addEventListener('input', e => { const p = e.target.dataset.in; if (p) setPath(p, e.target.value); });
shell.addEventListener('change', e => {
  const t = e.target; if (t.dataset.file) return FILE[t.dataset.file](e);
  if (t.dataset.in === 'office' && !LIVE) S.loginId = defaultUser(t.value, S.role);
  if (t.dataset.in && 'rr' in t.dataset) render();
});
shell.addEventListener('keydown', e => { if (e.key === 'Enter' && S.screen === 'login' && e.target.tagName === 'INPUT') S.admLogin ? ACT.admLoginGo() : login(); });
new ResizeObserver(() => { const w = shell.clientWidth >= WIDE_PX; if (w !== S.wide) set({ wide: w, legend: w }); else if (map) map.invalidateSize(); }).observe(shell);
S.wide = shell.clientWidth >= WIDE_PX; S.legend = S.wide;
render();
// เครือข่ายจริง (LIVE): ออนไลน์ → ส่งคิว · ลองซ้ำทุก 30 วิ เผื่อ event online ไม่มา
if (LIVE) {
  S.online = navigator.onLine;
  addEventListener('online', () => { set({ online: true }); flush(); });
  addEventListener('offline', () => set({ online: false }));
  setInterval(flush, 30000);
}
// Service Worker: เปิดแอปได้ตอนไม่มีเน็ต (ต้องเป็น https/localhost)
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw', e));
db.init().then(u => u ? enter(u) : render()).catch(e => showToast('เชื่อมต่อฐานข้อมูลไม่สำเร็จ: ' + e.message, 'err', 8000));
</script>
</body>
</html>
